<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <title>RosterMe - Free Signups for Schools, Volunteer Groups &amp; Community Organizers</title>
    <meta
      name="description"
      content="RosterMe is free volunteer scheduling for schools, volunteer groups, and community organizers. Create shifts, share one signup link, and see who's coming. No volunteer accounts needed."
    />
    <link rel="canonical" href="https://rosterme.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="RosterMe" />
    <meta
      name="keywords"
      content="volunteer scheduling, volunteer signups, school volunteer signup, community organizer, free signup tool, shift roster"
    />
    <!-- Open Graph (link embeds: Discord, WhatsApp, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RosterMe" />
    <meta
      property="og:title"
      content="RosterMe - Free Signups for Schools, Volunteer Groups & Community Organizers"
    />
    <meta
      property="og:description"
      content="Create volunteer shifts, share one signup link, and see who's coming. Free, no volunteer accounts needed."
    />
    <meta property="og:url" content="https://rosterme.app/" />
    <meta property="og:image" content="https://rosterme.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="RosterMe - volunteer scheduling without the spreadsheet chase" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="RosterMe - Free Signups for Schools, Volunteer Groups & Community Organizers"
    />
    <meta
      name="twitter:description"
      content="Create volunteer shifts, share one signup link, and see who's coming. Free, no volunteer accounts needed."
    />
    <meta name="twitter:image" content="https://rosterme.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="RosterMe - volunteer scheduling without the spreadsheet chase"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://rosterme.app/#website",
            "name": "RosterMe",
            "url": "https://rosterme.app/",
            "description": "Free volunteer scheduling for schools, volunteer groups, and community organizers."
          },
          {
            "@type": "Organization",
            "@id": "https://rosterme.app/#organization",
            "name": "RosterMe",
            "url": "https://rosterme.app/",
            "logo": "https://rosterme.app/og-image.png"
          },
          {
            "@type": "SoftwareApplication",
            "name": "RosterMe",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://rosterme.app/",
            "description": "Free volunteer scheduling: create shifts, share one signup link, and see who's coming. No volunteer accounts needed.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
    <style>
      html {
        background-color: #ffffff;
        color-scheme: light;
      }
      html.dark {
        background-color: #09090b;
        color-scheme: dark;
      }
      html.light {
        background-color: #ffffff;
        color-scheme: light;
      }
    </style>
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "dark" || stored === "light" || stored === "system"
            ? stored
            : "system";
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolved);
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {
        /* ignore (e.g. private mode) — React ThemeProvider will apply theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
