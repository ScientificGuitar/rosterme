gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 256;

# Chat-platform unfurlers (Discord, WhatsApp, ...) don't execute JS, so the
# SPA shell would unfurl as the generic site card. Detour them to the API's
# server-rendered per-invite OG tags; humans always get index.html below.
map $http_user_agent $invite_unfurl_detour {
    default 0;
    ~*(discordbot|whatsapp|telegrambot|slackbot|twitterbot|facebookexternalhit|linkedinbot|embedly|pinterestbot|viber|kakaotalk) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Crawler files: served directly, never fall through to the SPA.
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /og-image.png {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /apple-touch-icon.png {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /icon-192.png {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /icon-512.png {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /site.webmanifest {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Bot detour for /invite/:code (see map above). `return` inside `if` is
    # the only reliably safe directive there; the named location does the
    # actual proxying. error_page 418 is internal-only (not exposed).
    location ~ ^/invite/[A-Za-z0-9_-]+/?$ {
        error_page 418 = @invite_unfurl;
        if ($invite_unfurl_detour) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location @invite_unfurl {
        rewrite ^/invite/([A-Za-z0-9_-]+)/?$ /api/invite/$1/unfurl break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    error_page 404 /404.html;
}
